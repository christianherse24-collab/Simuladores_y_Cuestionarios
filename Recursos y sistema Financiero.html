<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuestionario: Recursos y Sistema Financiero</title>

  <!-- META TAGS PARA VISTA PREVIA EN WHATSAPP -->
  <meta property="og:title" content="Cuestionario: Recursos y Sistema Financiero">
  <meta property="og:description" content="Demuestra tus conocimientos sobre el sistema financiero con este cuestionario interactivo estilo Kahoot (25 preguntas).">
  <meta property="og:image" content="https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&w=1200&q=80">
  <meta property="og:url" content="https://christianherse24-collab.github.io/Simuladores_y_Cuestionarios/">
  <meta property="og:type" content="website">

  <style>
    :root {
      --bg-color: #46178f;
      --card-bg: #ffffff;
      --text-color: #333333;
      --red: #e21b3c;
      --blue: #1368ce;
      --yellow: #d89e00;
      --green: #26890c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .quiz-container {
      background-color: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      width: 100%;
      max-width: 600px;
      padding: 25px;
      text-align: center;
      position: relative;
    }

    .top-kahoot-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .kahoot-badge {
      background-color: #ffffff;
      color: #46178f;
      font-weight: 900;
      font-size: 1.4rem;
      padding: 6px 16px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .timer-pill {
      background-color: #ffc200;
      color: #000;
      font-weight: 800;
      font-size: 0.9rem;
      padding: 4px 10px;
      border-radius: 8px;
    }

    .sound-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      font-size: 1.2rem;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    h1 {
      color: #46178f;
      margin-bottom: 15px;
      font-size: 1.8rem;
    }

    p {
      margin-bottom: 20px;
      font-size: 1rem;
      color: #555;
    }

    .btn-main {
      background-color: #46178f;
      color: white;
      border: none;
      padding: 15px 35px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 0 #2a0e5a;
    }

    .quiz-info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
      font-weight: 800;
      color: #46178f;
      margin-bottom: 12px;
    }

    .timer-badge-inline {
      background-color: #f3f0f9;
      padding: 4px 10px;
      border-radius: 10px;
      color: #d89e00;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .score-badge-inline {
      color: #26890c;
    }

    .progress-track {
      height: 12px;
      background-color: #e5deef;
      border-radius: 6px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background-color: #d89e00;
      width: 100%;
      transition: width 1s linear;
    }

    .question-card {
      background-color: #ffffff;
      border: 2px solid #e5deef;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .question-card h2 {
      color: #111111;
      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1.4;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      border: none;
      border-radius: 12px;
      padding: 16px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      text-align: left;
      line-height: 1.3;
      box-shadow: 0 4px 0 rgba(0,0,0,0.2);
    }

    .opt-0 { background-color: var(--red); }
    .opt-1 { background-color: var(--blue); }
    .opt-2 { background-color: var(--yellow); }
    .opt-3 { background-color: var(--green); }

    .option-shape {
      font-size: 1.2rem;
      margin-right: 12px;
      flex-shrink: 0;
    }

    .feedback-title {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .correct-text { color: #26890c; }
    .incorrect-text { color: #e21b3c; }

    .final-score {
      font-size: 2.8rem;
      font-weight: 900;
      color: #46178f;
      margin: 15px 0;
    }
  </style>
</head>
<body>

  <div style="width: 100%; max-width: 600px;">
    <div class="top-kahoot-bar">
      <div class="kahoot-badge">
        Kahoot! <span class="timer-pill">23s</span>
      </div>
      <button class="sound-btn">🔊</button>
    </div>

    <div class="quiz-container">
      
      <!-- Pantalla Inicio -->
      <div id="start-screen" class="screen active">
        <h1>Cuestionario: Recursos y Sistema Financiero</h1>
        <p>Prueba interactiva de 25 preguntas sobre el sistema financiero.</p>
        <button class="btn-main" onclick="startQuiz()">Comenzar Cuestionario</button>
      </div>

      <!-- Pantalla Pregunta -->
      <div id="quiz-screen" class="screen">
        <div class="quiz-info-bar">
          <span id="question-count">Pregunta 1 de 25</span>
          <span class="timer-badge-inline">⏱ <span id="time-left-num">15s</span></span>
          <span class="score-badge-inline" id="score-count">0 Pts</span>
        </div>

        <div class="progress-track">
          <div id="progress-bar" class="progress-bar"></div>
        </div>

        <div class="question-card">
          <h2 id="question-title">Cargando...</h2>
        </div>

        <div class="options-grid">
          <button class="option-btn opt-0" onclick="selectOption(0)">
            <span class="option-shape">▲</span> <span id="opt-text-0">--</span>
          </button>
          <button class="option-btn opt-1" onclick="selectOption(1)">
            <span class="option-shape">◆</span> <span id="opt-text-1">--</span>
          </button>
          <button class="option-btn opt-2" onclick="selectOption(2)">
            <span class="option-shape">●</span> <span id="opt-text-2">--</span>
          </button>
          <button class="option-btn opt-3" onclick="selectOption(3)">
            <span class="option-shape">■</span> <span id="opt-text-3">--</span>
          </button>
        </div>
      </div>

      <!-- Pantalla Retroalimentación -->
      <div id="feedback-screen" class="screen">
        <div id="feedback-title" class="feedback-title">¡Respuesta Registrada!</div>
        <p id="feedback-detail"></p>
        <p>Puntuación acumulada: <strong id="current-score">0</strong> Pts</p>
        <br>
        <button class="btn-main" onclick="nextQuestion()">Siguiente Pregunta</button>
      </div>

      <!-- Pantalla Resultado Final -->
      <div id="result-screen" class="screen">
        <h1>¡Finalizado!</h1>
        <p>Tu puntuación total es:</p>
        <div id="final-score" class="final-score">0</div>
        <p id="final-message">¡Excelente trabajo!</p>
        <button class="btn-main" onclick="restartQuiz()">Volver a intentar</button>
      </div>

    </div>
  </div>

  <script>
    const questions = [
      {
        question: "¿Cómo se clasifican los recursos financieros según su origen de contratación o generación dentro o fuera del territorio nacional?",
        options: [
          "Recursos Financieros Internos y Recursos Financieros Externos",
          "Dinero Primario y Dinero Secundario",
          "Activos Líquidos y Activos Fijos",
          "Capital Regulado y Capital No Regulado"
        ],
        correct: 0,
        explanation: "Se dividen en internos (generados dentro del país) y externos (provenientes del exterior)."
      },
      {
        question: "¿Cuál es la función principal del sistema financiero?",
        options: [
          "Imprimir billetes sin límite",
          "Canalizar el ahorro hacia la inversión",
          "Cobrar comisiones de mantenimiento",
          "Fijar el costo de la canasta básica"
        ],
        correct: 1,
        explanation: "Conecta a los agentes con superávit (ahorramientos) con aquellos con déficit (inversión)."
      },
      {
        question: "¿Qué entidad supervisa y regula la política monetaria en el país?",
        options: [
          "La Bolsa de Valores",
          "El Banco Central / Junta Monetaria",
          "El Ministerio de Trabajo",
          "Los Bancos Comerciales Privados"
        ],
        correct: 1,
        explanation: "El Banco Central vela por la estabilidad de la moneda y la regulación financiera."
      },
      {
        question: "¿Qué se entiende por Dinero Primario?",
        options: [
          "El dinero generado por los créditos de bancos privados",
          "La emisión monetaria realizada directamente por el Banco Central",
          "Los cheques y tarjetas de crédito",
          "Las criptomonedas en circulación"
        ],
        correct: 1,
        explanation: "El dinero primario o base monetaria es emitido directamente por el instituto emisor."
      },
      {
        question: "¿Qué es el Encaje Legal?",
        options: [
          "Un impuesto aplicado a las ganancias bancarias",
          "El porcentaje de depósitos que los bancos deben mantener retenido en reserva",
          "La tasa de interés máxima para préstamos hipotecarios",
          "La comisión cobrada por el uso de cajeros"
        ],
        correct: 1,
        explanation: "El encaje legal garantiza la liquidez y solvencia del sistema bancario."
      },
      {
        question: "¿Qué son los activos financieros?",
        options: [
          "Bienes físicos como maquinaria y vehículos",
          "Títulos intangibles que otorgan derecho a recibir ingresos futuros",
          "Monedas antiguas de colección",
          "Deudas incobrables por parte del banco"
        ],
        correct: 1,
        explanation: "Son títulos que representan un crédito o derecho de cobro."
      },
      {
        question: "¿Qué diferencia a los bonos de las acciones?",
        options: [
          "Las acciones son instrumentos de deuda y los bonos de propiedad",
          "Los bonos representan deuda y las acciones representan participación en el capital",
          "Los bonos no generan ningún rendimiento",
          "Las acciones solo las emite el Estado"
        ],
        correct: 1,
        explanation: "El bono es un préstamo que realizas; la acción te vuelve copropietario de la empresa."
      },
      {
        question: "¿Qué es el Mercado Monetario?",
        options: [
          "Aquel donde se negocian activos a corto plazo de alta liquidez",
          "El mercado exclusivo de inmuebles y propiedades",
          "Donde se compran acciones a largo plazo",
          "La feria física de intercambio de divisas"
        ],
        correct: 0,
        explanation: "El mercado monetario se enfoca en instrumentos de deuda a corto plazo."
      },
      {
        question: "¿Qué es el Mercado de Capitales?",
        options: [
          "Donde se realizan intercambios directos sin dinero de por medio",
          "Mercado financiado a mediano y largo plazo (acciones y bonos de largo plazo)",
          "El sistema de pagos de facturas de servicios",
          "El cobro de impuestos por parte del Estado"
        ],
        correct: 1,
        explanation: "Se utiliza para financiar inversiones de mediano y largo plazo."
      },
      {
        question: "¿Qué indica la Liquidez de un instrumento financiero?",
        options: [
          "El color y estado físico de un billete",
          "La rapidez con la que se convierte en efectivo sin perder valor",
          "El porcentaje de impuestos que requiere pagar",
          "La antigüedad de la institución emisora"
        ],
        correct: 1,
        explanation: "Un activo es más líquido cuanto más rápido se puede transformar en dinero disponible."
      },
      {
        question: "¿A qué se refiere la Tasa de Interés Pasiva?",
        options: [
          "La tasa que cobran los bancos al otorgar préstamos",
          "La tasa que pagan los bancos a los ahorrantes por sus depósitos",
          "El impuesto por mora crediticia",
          "La comisión cobrada por transferencias internacionales"
        ],
        correct: 1,
        explanation: "La pasiva es la que recibe el cliente que deposita su dinero en el banco."
      },
      {
        question: "¿A qué se refiere la Tasa de Interés Activa?",
        options: [
          "La tasa que cobran las entidades financieras a quienes les prestan dinero",
          "La ganancia entregada en las cuentas de ahorro",
          "El costo de impresión de la moneda",
          "El descuento de la canasta básica"
        ],
        correct: 0,
        explanation: "Es la tasa que el banco cobra por otorgar créditos y financiamientos."
      },
      {
        question: "¿Qué es el Margen Financiero o Intermediación Financiera?",
        options: [
          "La diferencia entre la Tasa Activa y la Tasa Pasiva",
          "El saldo total de dólares en el Banco Central",
          "El precio del oro en la Bolsa",
          "La suma de los salarios de los empleados bancarios"
        ],
        correct: 0,
        explanation: "Es la ganancia del banco por la diferencia entre lo que cobra y lo que paga de interés."
      },
      {
        question: "¿Qué es el Riesgo Crediticio?",
        options: [
          "El riesgo de que la moneda se devalúe",
          "La posibilidad de que un deudor no pague su obligación",
          "El aumento de tasas por decisión del gobierno",
          "El fallo informático en las bancas en línea"
        ],
        correct: 1,
        explanation: "Ocurre cuando el prestatario no cumple con las cuotas acordadas."
      },
      {
        question: "¿Qué representa la Inflación?",
        options: [
          "El aumento generalizado y continuo del nivel de precios",
          "El aumento en la producción agrícola de un país",
          "La caída constante de los salarios mínimos",
          "La devaluación obligatoria del dólar estadounidense"
        ],
        correct: 0,
        explanation: "La inflación destruye paulatinamente el poder de compra del dinero."
      },
      {
        question: "¿Qué es la Deflación?",
        options: [
          "La subida descontrolada de precios",
          "La baja generalizada y prolongada del nivel de precios",
          "La escasez de papel para imprimir billetes",
          "El aumento masivo de impuestos al consumo"
        ],
        correct: 1,
        explanation: "Es el fenómeno contrario a la inflación, los precios disminuyen en promedio."
      },
      {
        question: "¿Qué es un Mercado Secundario?",
        options: [
          "Donde se emiten los títulos valores por primera vez",
          "Donde se revenden e intercambian títulos previamente emitidos",
          "El mercado exclusivo de pequeñas empresas",
          "El sector informal de intercambio comercial"
        ],
        correct: 1,
        explanation: "Aporta liquidez permitiendo que los dueños de bonos u acciones los vendan a terceros."
      },
      {
        question: "¿Qué es un Fondo de Inversión?",
        options: [
          "Patrimonio reunido por varios inversionistas para gestionar diversificadamente",
          "Una caja fuerte física ubicada en la sede bancaria",
          "El presupuesto anual asignado a los ministerios",
          "Un seguro de vida obligatorio"
        ],
        correct: 0,
        explanation: "Permite acceder a portafolios diversificados administrados profesionalmente."
      },
      {
        question: "¿Qué significa Diversificar una inversión?",
        options: [
          "Colocar todo el capital en un solo activo rentable",
          "Repartir la inversión entre varios activos para mitigar riesgos",
          "Guardar el dinero en efectivo bajo el colchón",
          "Gastar las ganancias en bienes de consumo rápido"
        ],
        correct: 1,
        explanation: "No poner todos los huevos en la misma canasta reduce el impacto de pérdidas."
      },
      {
        question: "¿Qué es la Política Fiscal?",
        options: [
          "El control de los tipos de interés por parte del Banco Central",
          "La administración del gasto público y la recaudación de impuestos por el Gobierno",
          "El reglamento de contratación de personal en bancos",
          "El conjunto de normas de comercio exterior"
        ],
        correct: 1,
        explanation: "La ejecuta el Ministerio de Finanzas/Hacienda a través del presupuesto e impuestos."
      },
      {
        question: "¿Qué son los Títulos de Deuda Pública?",
        options: [
          "Documentos emitidos por el Estado para captar financiamiento",
          "Multas impuestas a los ciudadanos que no pagan impuestos",
          "Acciones de empresas privadas adquiridas por personas",
          "Contratos de alquiler de edificios públicos"
        ],
        correct: 0,
        explanation: "Son bonos u obligaciones emitidas por el gobierno para financiar gasto público."
      },
      {
        question: "¿Qué es la Tasa Interna de Retorno (TIR)?",
        options: [
          "La tasa de descuento que iguala el valor presente de ingresos y egresos (VPN = 0)",
          "El porcentaje devuelto por las compras con tarjeta de crédito",
          "La comisión cobrada al retirar dinero de un cajero ajeno",
          "El interés anual cobrado por casas de empeño"
        ],
        correct: 0,
        explanation: "Indica la rentabilidad media anual que genera un proyecto de inversión."
      },
      {
        question: "¿Qué es el Valor Presente Neto (VPN)?",
        options: [
          "El cálculo que trae los flujos de dinero futuros al valor de hoy restando la inversión inicial",
          "El total de dinero existente en la caja chica de la empresa",
          "El precio de venta de una maquinaria al final de su vida útil",
          "La suma simple sin intereses de las ganancias previstas"
        ],
        correct: 0,
        explanation: "Permite evaluar si una inversión aumentará o disminuirá el valor financiero actual."
      },
      {
        question: "¿Qué es el Apalancamiento Financiero?",
        options: [
          "Utilizar endeudamiento para aumentar la capacidad de inversión",
          "Pedir préstamos para pagar salarios vencidos",
          "Aumentar la cantidad de empleados en el área de ventas",
          "Cerrar cuentas bancarias que generen comisiones"
        ],
        correct: 0,
        explanation: "Consiste en usar crédito externo con la meta de multiplicar la rentabilidad."
      },
      {
        question: "¿Qué es el Tipo de Cambio?",
        options: [
          "El precio de una moneda nacional expresado en función de una divisa extranjera",
          "La comisión que se paga por cambiar un billete roto",
          "La variación diaria del costo de la gasolina",
          "El costo de envío de dinero por giros postales"
        ],
        correct: 0,
        explanation: "Indica cuántas unidades de moneda local equivalen a una unidad de moneda extranjera."
      }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let timerInterval;
    let timeLeft = 15;

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function startQuiz() {
      currentQuestionIndex = 0;
      score = 0;
      showScreen('quiz-screen');
      loadQuestion();
    }

    function loadQuestion() {
      const q = questions[currentQuestionIndex];
      document.getElementById('question-count').innerText = `Pregunta ${currentQuestionIndex + 1} de ${questions.length}`;
      document.getElementById('score-count').innerText = `${score} Pts`;
      document.getElementById('question-title').innerText = q.question;

      q.options.forEach((opt, index) => {
        document.getElementById(`opt-text-${index}`).innerText = opt;
      });

      startTimer();
    }

    function startTimer() {
      timeLeft = 15;
      const progress = document.getElementById('progress-bar');
      document.getElementById('time-left-num').innerText = `${timeLeft}s`;
      progress.style.width = '100%';

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('time-left-num').innerText = `${timeLeft}s`;
        progress.style.width = `${(timeLeft / 15) * 100}%`;

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          selectOption(-1);
        }
      }, 1000);
    }

    function selectOption(index) {
      clearInterval(timerInterval);
      const q = questions[currentQuestionIndex];
      const isCorrect = (index === q.correct);

      const titleEl = document.getElementById('feedback-title');
      const detailEl = document.getElementById('feedback-detail');

      if (isCorrect) {
        score += 100 + (timeLeft * 10);
        titleEl.innerText = "¡RESPUESTA CORRECTA!";
        titleEl.className = "feedback-title correct-text";
        detailEl.innerText = q.explanation;
      } else if (index === -1) {
        titleEl.innerText = "¡TIEMPO AGOTADO!";
        titleEl.className = "feedback-title incorrect-text";
        detailEl.innerText = `La correcta era: ${q.options[q.correct]}. ${q.explanation}`;
      } else {
        titleEl.innerText = "¡INCORRECTO!";
        titleEl.className = "feedback-title incorrect-text";
        detailEl.innerText = `La correcta era: ${q.options[q.correct]}. ${q.explanation}`;
      }

      document.getElementById('current-score').innerText = score;
      showScreen('feedback-screen');
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < questions.length) {
        showScreen('quiz-screen');
        loadQuestion();
      } else {
        showFinalScreen();
      }
    }

    function showFinalScreen() {
      document.getElementById('final-score').innerText = score;
      showScreen('result-screen');
    }

    function restartQuiz() {
      startQuiz();
    }
  </script>
</body>
</html>
